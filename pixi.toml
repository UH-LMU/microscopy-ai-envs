[workspace]
name = "microscopy-ai-envs"
channels = ["conda-forge"]
# The CUDA-12 envs solve against the named platforms (virtual package
# __cuda=12, so cuda builds of pytorch are selectable); everything else uses
# the bare subdirs.
platforms = [
  "win-64",
  "linux-64",
  { name = "win-64-cuda12", platform = "win-64", cuda = "12" },
  { name = "linux-64-cuda12", platform = "linux-64", cuda = "12" },
]

# ---- Tasks ----
[tasks]
# Display available envs
list = "python -c \"print('envs: cellpose3, cellpose4, micro-sam')\""

# Smoke-test envs incl. CUDA. `pixi run test [env ...]` tests all/selected envs
# (runner uses the system python; without one, e.g. on Windows, use
# `pixi run -e cellpose4 python scripts/test_envs.py`); `pixi run -e <env>
# check-env` tests one.
# CHECK_GPU=auto|require|skip controls the CUDA checks.
test = "python scripts/test_envs.py"
check-env = "python scripts/check_env.py"

# Build docker images (examples; adjust registry)
"docker:build:cp3" = "sudo docker build -f docker/Dockerfile.cellpose3 -t ghcr.io/uh-lmu/cellpose3:latest ."
"docker:build:cp4" = "sudo docker build -f docker/Dockerfile.cellpose4 -t ghcr.io/uh-lmu/cellpose4:latest ."
"docker:build:microsam" = "sudo docker build -f docker/Dockerfile.microsam -t ghcr.io/uh-lmu/micro-sam:latest ."

# ---- CUDA feature ----
[feature.cuda.dependencies]
cuda = ">=12"
cudnn = "*"
pytorch-gpu = "*"
cuda-version = "12.8.*"

[feature.cuda.tasks]
warmup = "python warmup.py"

[feature.cuda]
channels = ["nvidia"]
platforms = ["linux-64-cuda12", "win-64-cuda12"]


[feature.cellpose3.dependencies]
python = "3.10.*"
cellpose = "<4"

[feature.cellpose4.dependencies]
python = "3.10.*"
cellpose = ">=4.0"

[feature.micro-sam.dependencies]
python = "3.12.*"
micro_sam = ">=1.8.14,<1.9"
# npe2 (napari plugin manifests) breaks on pydantic 2.11.* -- "PluginManifest is
# not fully defined; you should define Draft06JsonSchema". npe2 >=0.9 excludes it.
pydantic = ">=2.12"
npe2 = ">=0.9"

# PyOpenGL >=3.1.10 dlopens the unversioned "libGLX.so" first. Without an
# env-local one it picks up the system copy (from libglx-dev) while Qt links
# the env's libGLX.so.0 -> "Could not initialize GLX" and napari aborts.
[feature.micro-sam.target.linux-64.dependencies]
libglx-devel = "*"

# trackastra -> motile/ilpy -> pyscipopt -> scip/ipopt/mumps-seq. Older win-64
# builds of these depend on libflang 5 -> openmp 5.0.0 (2018), which installs
# its own Library/bin/libiomp5md.dll over intel-openmp's; torch then fails with
# "DLL load failed while importing _C: The specified procedure could not be
# found". Constraining libflang (not adding it) steers the solver to newer builds.
[feature.micro-sam.target.win-64.constraints]
libflang = ">=6"

[feature.cuda11]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[feature.cuda11.dependencies]
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"

[feature.cuda11.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
XLA_FLAGS = "--xla_gpu_cuda_data_dir=$CONDA_PREFIX"

[feature.tensorflow]
platforms = ["linux-64", "win-64"]

[feature.tensorflow.dependencies]
python = "3.10.*"
pip = "*"
numpy = "<2"
scipy = "<1.14"

[feature.tensorflow.pypi-dependencies]
tensorflow = "< 2.11"

[feature.stardist]
platforms = ["linux-64", "win-64"]

[feature.stardist.pypi-dependencies]
stardist = "*"

# imagecodecs has no py310 win-64 build newer than 2025.3.30, and that one
# needs libdeflate 1.24.*. Without this the solver lands on libdeflate 1.25 and
# the lock is inconsistent, so every `pixi run` tries to rewrite pixi.lock.
[feature.stardist.target.win-64.constraints]
libdeflate = "1.24.*"

# Interactive/workstation extras: kernel + common analysis packages on top of any base env.
[feature.jupyter.dependencies]
ipykernel = "*"
jupyterlab = "*"
ipywidgets = "*"
matplotlib = "*"
pandas = "*"
scikit-image = "*"
scikit-learn = "*"

[environments]
cellpose3 = {features = ["cuda", "cellpose3"], solve-group = "cellpose3"}
cellpose4 = {features = ["cuda", "cellpose4"], solve-group = "cellpose4"}
micro-sam = {features = ["cuda", "micro-sam"], solve-group = "micro-sam"}
stardist = {features = ["cuda11", "tensorflow", "stardist"], solve-group = "stardist"}
cellpose3-full = {features = ["cuda", "cellpose3", "jupyter"], solve-group = "cellpose3"}
cellpose4-full = {features = ["cuda", "cellpose4", "jupyter"], solve-group = "cellpose4"}
micro-sam-full = {features = ["cuda", "micro-sam", "jupyter"], solve-group = "micro-sam"}
stardist-full = {features = ["cuda11", "tensorflow", "stardist", "jupyter"], solve-group = "stardist"}
