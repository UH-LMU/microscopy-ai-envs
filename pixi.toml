[workspace]
name = "microscopy-ai-envs"
channels = ["conda-forge"]
# Named platform entries below need a recent pixi (0.57 can't parse them).
# Keep docker/Dockerfile.* `FROM ghcr.io/prefix-dev/pixi:<ver>` in step.
requires-pixi = ">=0.81"
# The CUDA-12 envs solve against the named platforms (virtual package
# __cuda=12, so cuda builds of pytorch are selectable); everything else uses
# the bare subdirs.
platforms = [
  "win-64",
  "linux-64",
  { name = "win-64-cuda12", platform = "win-64", cuda = "12" },
  { name = "linux-64-cuda12", platform = "linux-64", cuda = "12" },
]

# ---- Tasks ----
[tasks]
# Display available envs
list = "python -c \"print('envs: cellpose3, cellpose4, micro-sam')\""

# Smoke-test envs incl. CUDA. `pixi run test [env ...]` tests all/selected envs
# (runner uses the system python; without one, e.g. on Windows, use
# `pixi run -e cellpose4 python scripts/test_envs.py`); `pixi run -e <env>
# check-env` tests one.
# CHECK_GPU=auto|require|skip controls the CUDA checks.
test = "python scripts/test_envs.py"
check-env = "python scripts/check_env.py"

# Build docker images (examples; adjust registry)
"docker:build:cp3" = "sudo docker build -f docker/Dockerfile.cellpose3 -t ghcr.io/uh-lmu/cellpose3:latest ."
"docker:build:cp4" = "sudo docker build -f docker/Dockerfile.cellpose4 -t ghcr.io/uh-lmu/cellpose4:latest ."
"docker:build:microsam" = "sudo docker build -f docker/Dockerfile.microsam -t ghcr.io/uh-lmu/micro-sam:latest ."

# Build Apptainer .sif images (docker build -> save -> apptainer build with
# docker/pixi-env.def). `pixi run sif:build <env> [version]`; output in ./sif/.
"sif:build" = "bash scripts/build-sif.sh"
"sif:build:cp3" = "bash scripts/build-sif.sh cellpose3"
"sif:build:cp4" = "bash scripts/build-sif.sh cellpose4"
"sif:build:microsam" = "bash scripts/build-sif.sh micro-sam"

# Windows: make env files inherit the env folder's permissions, so other users
# can run them. Re-run after installs. `pixi run fix-perms [env ...]`.
[target.win-64.tasks]
fix-perms = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fix-env-permissions.ps1"

# ---- CUDA feature ----
[feature.cuda.dependencies]
cuda = ">=12"
cudnn = "*"
pytorch-gpu = "*"
cuda-version = "12.8.*"

[feature.cuda.tasks]
warmup = "python warmup.py"

[feature.cuda]
channels = ["nvidia"]
platforms = ["linux-64-cuda12", "win-64-cuda12"]


[feature.cellpose3.dependencies]
python = "3.12.*"
cellpose = "<4"

[feature.cellpose4.dependencies]
python = "3.12.*"
cellpose = ">=4.0"

[feature.micro-sam.dependencies]
python = "3.12.*"
micro_sam = ">=1.8.14,<1.9"
# npe2 (napari plugin manifests) breaks on pydantic 2.11.* -- "PluginManifest is
# not fully defined; you should define Draft06JsonSchema". npe2 >=0.9 excludes it.
pydantic = ">=2.12"
npe2 = ">=0.9"

# PyOpenGL >=3.1.10 dlopens the unversioned "libGLX.so" first. Without an
# env-local one it picks up the system copy (from libglx-dev) while Qt links
# the env's libGLX.so.0 -> "Could not initialize GLX" and napari aborts.
[feature.micro-sam.target.linux-64.dependencies]
libglx-devel = "*"

# vispy finds libGL via ctypes.util.find_library("GL"), which only looks in the
# ldconfig cache / via gcc or ld. In the docker/sif images (no system libGL, no
# toolchain) that finds nothing -> "GL ES 2.0 library not found" on importing
# micro_sam. Point it at the env's own libglvnd libGL, the one Qt uses anyway.
[feature.micro-sam.target.linux-64.activation.env]
VISPY_GL_LIB = "$CONDA_PREFIX/lib/libGL.so.1"

# trackastra -> motile/ilpy -> pyscipopt -> scip/ipopt/mumps-seq. Older win-64
# builds of these depend on libflang 5 -> openmp 5.0.0 (2018), which installs
# its own Library/bin/libiomp5md.dll over intel-openmp's; torch then fails with
# "DLL load failed while importing _C: The specified procedure could not be
# found". Constraining libflang (not adding it) steers the solver to newer builds.
[feature.micro-sam.target.win-64.constraints]
libflang = ">=6"
# Solving around the above (newer flang builds need llvm-openmp, so pytorch
# >=2.8) the solver backtracked to numpy 1.26 / dask 2023.3 / matplotlib 3.9.
# Old dask hands napari read-only label chunks, and PartSegCore then fails
# with "buffer source array is read-only". Keep these in line with linux-64.
numpy = ">=2"
dask-core = ">=2025"
matplotlib-base = ">=3.10"

[feature.cuda11]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[feature.cuda11.dependencies]
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"

[feature.cuda11.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
XLA_FLAGS = "--xla_gpu_cuda_data_dir=$CONDA_PREFIX"

[feature.tensorflow]
platforms = ["linux-64", "win-64"]

[feature.tensorflow.dependencies]
python = "3.10.*"
pip = "*"
numpy = "<2"
scipy = "<1.14"

[feature.tensorflow.pypi-dependencies]
tensorflow = "< 2.11"

[feature.stardist]
platforms = ["linux-64", "win-64"]

[feature.stardist.pypi-dependencies]
stardist = "*"

# imagecodecs has no py310 win-64 build newer than 2025.3.30, and that one
# needs libdeflate 1.24.*. Without this the solver lands on libdeflate 1.25 and
# the lock is inconsistent, so every `pixi run` tries to rewrite pixi.lock.
[feature.stardist.target.win-64.constraints]
libdeflate = "1.24.*"

# Image readers (bioio + plugins), in both minimal and -full envs since batch
# jobs in containers need them too. bioio needs python >=3.11, so not stardist.
[feature.io.dependencies]
bioio = "*"
bioio-lif = "*"
bioio-ome-tiff = "*"
bioio-ome-zarr = "*"
bioio-tifffile = "*"
pip = "*"  # pixi-to-conda-lock needs it when pypi-dependencies are present

# bioio-czi and its aicspylibczi >=4 are not on conda-forge. The pixi warning
# "bioio-czi overwrites conda package bioio-lif: .../site-packages/scripts/
# benchmark.py" is harmless: the bioio plugins all ship that stray file.
[feature.io.pypi-dependencies]
bioio-czi = "*"

# Same readers for stardist (python 3.10, TF 2.10). conda-forge's bioio needs
# python >=3.11, but on PyPI bioio, ome-tiff, tifffile and czi allow 3.10;
# ome-zarr and lif fall back to older releases. numpy/scipy stay pinned on
# the conda side by [feature.tensorflow].
[feature.io-stardist]
platforms = ["linux-64", "win-64"]

[feature.io-stardist.dependencies]
pip = "*"

[feature.io-stardist.pypi-dependencies]
bioio = "*"
bioio-czi = "*"
bioio-lif = "*"
bioio-ome-tiff = "*"
bioio-ome-zarr = "*"
bioio-tifffile = "*"

# Interactive/workstation extras: kernel + common analysis packages on top of any base env.
[feature.jupyter.dependencies]
ipykernel = "*"
jupyterlab = "*"
ipywidgets = "*"
# matplotlib-base, not the `matplotlib` metapackage: the latter pulls in a Qt
# binding (PySide6, or PyQt5 for old versions), which on win-64 fought with
# napari's PyQt6 in micro-sam-full. Inline/Tk backends need no Qt.
matplotlib-base = "*"
pandas = "*"
scikit-image = "*"
scikit-learn = "*"

[environments]
cellpose3 = {features = ["cuda", "cellpose3", "io"], solve-group = "cellpose3"}
cellpose4 = {features = ["cuda", "cellpose4", "io"], solve-group = "cellpose4"}
micro-sam = {features = ["cuda", "micro-sam", "io"], solve-group = "micro-sam"}
stardist = {features = ["cuda11", "tensorflow", "stardist", "io-stardist"], solve-group = "stardist"}
cellpose3-full = {features = ["cuda", "cellpose3", "io", "jupyter"], solve-group = "cellpose3"}
cellpose4-full = {features = ["cuda", "cellpose4", "io", "jupyter"], solve-group = "cellpose4"}
micro-sam-full = {features = ["cuda", "micro-sam", "io", "jupyter"], solve-group = "micro-sam"}
stardist-full = {features = ["cuda11", "tensorflow", "stardist", "io-stardist", "jupyter"], solve-group = "stardist"}
